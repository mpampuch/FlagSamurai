[package]
name = "flagsamurai"
version = "0.1.4"
edition = "2024"
description = "Inspect and manipulate SAM-style bit flags (SAM/BAM/CRAM)"
readme = "README.md"
license = "MIT"
keywords = ["sam", "bam", "cram", "flags", "bioinformatics"]
categories = ["command-line-utilities", "science::bioinformatics"]
repository = "https://github.com/mpampuch/FlagSamurai"


# Two binaries from the same source: full name and short alias.
[[bin]]
name = "flagsamurai"
path = "src/main.rs"

[[bin]]
name = "flagsam"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
termcolor = "1.4"
crossterm = "0.29.0"
